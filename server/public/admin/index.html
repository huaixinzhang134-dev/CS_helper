<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS Match Pro 管理后台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 登录页 -->
    <div id="loginPage" class="page">
      <div class="login-box">
        <h1>CS Match Pro 管理后台</h1>
        <div class="form-group">
          <input type="text" id="loginUsername" placeholder="用户名">
        </div>
        <div class="form-group">
          <input type="password" id="loginPassword" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
        </div>
        <div id="loginError" class="error-msg"></div>
        <button onclick="doLogin()" id="loginBtn">登录</button>
      </div>
    </div>

    <!-- 主页面 -->
    <div id="mainPage" class="page" style="display:none">
      <div class="topbar">
        <h2>管理后台</h2>
        <div>
          <span id="adminUserDisplay" class="admin-name"></span>
          <button class="btn-sm" onclick="doLogout()">退出</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="users" onclick="switchTab('users')">用户管理</button>
        <button class="tab" data-tab="players" onclick="switchTab('players')">选手管理</button>
        <button class="tab" data-tab="teams" onclick="switchTab('teams')">战队管理</button>
        <button class="tab" data-tab="comments" onclick="switchTab('comments')">评论审核</button>
        <button class="tab" data-tab="votes" onclick="switchTab('votes')">猜测管理</button>
        <button class="tab" data-tab="nicknames" onclick="switchTab('nicknames')">绰号审核</button>
      </div>

      <div class="tab-content" id="tab-users">
        <div class="toolbar">
          <input type="text" id="userSearch" placeholder="搜索用户..." oninput="loadUsers()">
        </div>
        <table>
          <thead><tr><th>ID</th><th>昵称</th><th>胜场</th><th>总局</th><th>胜率</th><th>代币</th><th>操作</th></tr></thead>
          <tbody id="userTableBody"></tbody>
        </table>
        <div class="pagination" id="userPagination"></div>
      </div>

      <div class="tab-content" id="tab-players" style="display:none">
        <div class="toolbar">
          <input type="text" id="playerSearch" placeholder="搜索选手..." oninput="debouncePlayerSearch()">
        </div>
        <table>
          <thead><tr><th>ID</th><th>游戏ID</th><th>真实姓名</th><th>战队</th><th>位置</th><th>状态</th><th>Rating</th><th>操作</th></tr></thead>
          <tbody id="playerTableBody"></tbody>
        </table>
        <div class="pagination" id="playerPagination"></div>
      </div>

      <!-- 编辑选手弹窗 -->
      <div id="playerModal" class="modal" style="display:none">
        <div class="modal-content modal-lg">
          <span class="close" onclick="closeModal('playerModal')">&times;</span>
          <h3>编辑选手</h3>
          <div class="form-grid">
            <div class="form-group"><label>游戏ID</label><input type="text" id="editPlayerName"></div>
            <div class="form-group"><label>真实姓名</label><input type="text" id="editPlayerRealName"></div>
            <div class="form-group"><label>战队</label><input type="text" id="editPlayerTeam"></div>
            <div class="form-group"><label>曾效力队伍（逗号分隔）</label><input type="text" id="editPlayerFormerTeams" placeholder="如：Fnatic, G2, Astralis"></div>
            <div class="form-group"><label>位置</label>
              <select id="editPlayerPosition">
                <option value="步枪手">步枪手</option>
                <option value="狙击手">狙击手</option>
                <option value="教练">教练</option>
              </select>
            </div>
            <div class="form-group"><label>状态</label>
              <select id="editPlayerStatus">
                <option value="active">现役</option>
                <option value="retired">退役</option>
                <option value="coach">教练</option>
                <option value="free_agent">自由人</option>
              </select>
            </div>
            <div class="form-group"><label>Rating</label><input type="number" step="0.01" id="editPlayerRating"></div>
            <div class="form-group"><label>狙击率</label><input type="number" id="editPlayerSniping"></div>
            <div class="form-group"><label>Major次数</label><input type="number" id="editPlayerMajor"></div>
          </div>
          <input type="hidden" id="editPlayerId">
          <button onclick="savePlayer()">保存</button>
        </div>
      </div>

      <div class="tab-content" id="tab-teams" style="display:none">
        <div class="toolbar">
          <input type="text" id="teamSearch" placeholder="搜索战队..." oninput="debounceTeamSearch()">
        </div>
        <table>
          <thead><tr><th>ID</th><th>队名</th><th>赛区</th><th>当前成员数</th><th>HLTV Logo</th><th>5eplay Logo</th><th>操作</th></tr></thead>
          <tbody id="teamTableBody"></tbody>
        </table>
        <div class="pagination" id="teamPagination"></div>
      </div>

      <!-- 编辑战队弹窗 -->
      <div id="teamModal" class="modal" style="display:none">
        <div class="modal-content">
          <span class="close" onclick="closeModal('teamModal')">&times;</span>
          <h3>编辑战队</h3>
          <div class="form-group"><label>队名</label><input type="text" id="editTeamName"></div>
          <div class="form-group"><label>赛区</label>
            <select id="editTeamRegion">
              <option value="Europe">Europe</option>
              <option value="Americas">Americas</option>
              <option value="Asia">Asia</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group"><label>HLTV 队标 URL</label><input type="text" id="editTeamLogoUrl" placeholder="https://..."></div>
          <div class="form-group"><label>5eplay 队标 URL</label><input type="text" id="editTeamLogo5eplayUrl" placeholder="https://..."></div>
          <input type="hidden" id="editTeamId">
          <button onclick="saveTeam()">保存</button>
        </div>
      </div>

      <div class="tab-content" id="tab-comments" style="display:none">
        <table>
          <thead><tr><th>用户</th><th>选手</th><th>内容</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="commentTableBody"></tbody>
        </table>
        <div class="pagination" id="commentPagination"></div>
      </div>

      <div class="tab-content" id="tab-nicknames" style="display:none">
        <div class="toolbar">
          <label>状态筛选：</label>
          <select id="nicknameFilter" onchange="loadNicknames()">
            <option value="pending">待审核</option>
            <option value="approved">已通过</option>
            <option value="rejected">已拒绝</option>
            <option value="all">全部</option>
          </select>
        </div>
        <table>
          <thead><tr><th>ID</th><th>类型</th><th>目标</th><th>别名</th><th>提交者</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="nicknameTableBody"></tbody>
        </table>
        <div class="pagination" id="nicknamePagination"></div>
      </div>

      <div class="tab-content" id="tab-votes" style="display:none">
        <div class="subsection">
          <h3>提交开关控制</h3>
          <div class="slot-grid" id="slotGrid"></div>
          <button onclick="saveSlotConfig()" id="saveSlotBtn">保存开关配置</button>
        </div>
        <div class="subsection">
          <h3>官方 Top30 设定</h3>
          <div id="winnerList"></div>
          <button onclick="addWinnerRow()">+ 添加选手</button>
          <button onclick="saveWinners()">保存 Top30</button>
        </div>
        <div class="subsection">
          <h3>核对发奖</h3>
          <div class="form-row">
            <label>猜对阈值：</label>
            <input type="number" id="matchThreshold" value="15" style="width:80px">
            <button onclick="checkResults()">核对</button>
            <button onclick="awardCoins()" style="background:#e74c3c">发放代币奖励</button>
          </div>
          <div id="checkResult"></div>
          <div id="awardResult"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑用户弹窗 -->
  <div id="userModal" class="modal" style="display:none">
    <div class="modal-content">
      <span class="close" onclick="closeModal('userModal')">&times;</span>
      <h3>编辑用户</h3>
      <div class="form-group"><label>昵称</label><input type="text" id="editNickname"></div>
      <div class="form-group"><label>代币</label><input type="number" id="editCoins"></div>
      <input type="hidden" id="editOpenid">
      <button onclick="saveUser()">保存</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
